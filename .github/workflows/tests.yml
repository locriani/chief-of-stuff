name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unittest:
    # A self-hosted runner on a public repo: never run a fork's code on it.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, chief-of-stuff]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t chief-of-stuff-ci .github/ci
      # The checkout is mounted read-only and copied, so the tests touch nothing on the host and need no network.
      - run: >
          docker run --rm --network none -v "$PWD":/repo:ro chief-of-stuff-ci
          sh -c 'cp -R /repo/. . && python3 -m unittest discover -s evals -p "test_*.py"'
